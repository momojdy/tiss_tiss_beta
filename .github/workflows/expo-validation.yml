name: Expo validation

on:
  push:
    branches: [main, goodies/production-readiness]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify Goodies CMS source coverage
        run: node scripts/check-goodies-cms.cjs && node tests/goodies-cms.test.cjs
      - name: Verify Goodies review isolation and refresh
        run: node tests/goodies-reviews.test.cjs
      - name: Verify unique migration versions
        run: node scripts/check-migration-versions.cjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Export Expo web bundle
        run: npx expo export --platform web
      - name: Expo Doctor
        run: npx expo-doctor

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check deployed edge functions
        run: deno check --config supabase/functions/deno.json supabase/functions/wantiss-admin-bootstrap/index.ts supabase/functions/wantiss-admin-staff/index.ts supabase/functions/wantiss-public-content/index.ts supabase/functions/wantiss-cms-public/index.ts supabase/functions/goodies-delivery-quote/index.ts supabase/functions/rapid-api/index.ts supabase/functions/process-goodies-card-refunds/index.ts supabase/functions/place-goodies-card-order/index.ts supabase/functions/refund-goodies-card-order/index.ts supabase/functions/expire-goodies-card-auth/index.ts
      - name: Test Goodies refund and webhook decision logic
        run: deno test --allow-read --allow-env --config supabase/functions/deno.json supabase/functions/goodies-tests/ supabase/functions/process-goodies-card-refunds/ supabase/functions/rapid-api/goodiesStripeState_test.ts
