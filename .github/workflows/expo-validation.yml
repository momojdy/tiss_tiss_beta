name: Expo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: tiss_tiss_beta

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss_tiss_beta
      - name: Checkout paired admin CMS contracts
        uses: actions/checkout@v4
        with:
          repository: momojdy/tiss-admin
          ref: d65a3a761f9e81ca6a7419c346cc50760f00645c
          path: tiss-admin
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiss_tiss_beta/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify Goodies CMS source coverage
        run: npm run check:goodies-cms && npm run test:goodies
      - name: Verify prepared Goodies FAQ release is publishable
        run: npm run check:goodies-acceptance-content
      - name: Verify Goodies review isolation and refresh
        run: npm run test:goodies-cross-role
      - name: Check privileged client credentials
        run: npm run check:goodies-client-secrets -- --paired
      - name: Verify unique migration versions
        run: node scripts/check-migration-versions.cjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Export Expo web bundle
        env:
          # Offline verification artifact only; the Chrome check blocks every external page request.
          EXPO_PUBLIC_SUPABASE_URL: https://ycbirmgppwavorwudlrv.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_offline_verification_only
        run: npx expo export --platform web
      - name: Verify the exported app actually mounts in Chrome
        run: node scripts/check-goodies-browser-boot.cjs --root dist --report goodies-browser-boot.json
      - name: Retain browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodies-browser-boot-${{ github.sha }}
          path: tiss_tiss_beta/goodies-browser-boot.json
          if-no-files-found: warn
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Upload customer web verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: goodies-customer-web-verification-${{ github.sha }}
          path: tiss_tiss_beta/dist
          if-no-files-found: error

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss_tiss_beta
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Type-check deployed edge functions
        run: deno check --config supabase/functions/deno.json supabase/functions/create-card-setup-intent/index.ts supabase/functions/wantiss-admin-bootstrap/index.ts supabase/functions/wantiss-admin-staff/index.ts supabase/functions/wantiss-public-content/index.ts supabase/functions/wantiss-cms-public/index.ts supabase/functions/goodies-delivery-quote/index.ts supabase/functions/rapid-api/index.ts supabase/functions/process-goodies-card-refunds/index.ts supabase/functions/place-goodies-card-order/index.ts supabase/functions/refund-goodies-card-order/index.ts supabase/functions/expire-goodies-card-auth/index.ts supabase/functions/process-goodies-push-notifications/index.ts supabase/functions/refresh-goodies-exchange-rate/index.ts
      - name: Test Goodies refund and webhook decision logic
        run: deno test --allow-read --allow-env --config supabase/functions/deno.json supabase/functions/goodies-tests/ supabase/functions/process-goodies-card-refunds/ supabase/functions/rapid-api/goodiesStripeState_test.ts

  settlement-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOODIES_TEST_CONTAINER: wantiss-goodies-settlement-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss_tiss_beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start isolated PostgreSQL matching the observed production version
        run: docker run --name "$GOODIES_TEST_CONTAINER" --network none -e POSTGRES_HOST_AUTH_METHOD=trust -d postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      - name: Verify Goodies financial concurrency using synthetic data
        shell: bash
        run: node scripts/test-goodies-settlement-postgres.cjs --container "$GOODIES_TEST_CONTAINER" --shared-bill --reaudit | tee goodies-settlement-races.log
      - name: Upload financial race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodies-settlement-races-${{ github.sha }}
          path: tiss_tiss_beta/goodies-settlement-races.log
          if-no-files-found: warn
      - name: Remove this test container
        if: always()
        run: docker rm -f "$GOODIES_TEST_CONTAINER"

  goodies-local-api:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss_tiss_beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiss_tiss_beta/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Install locked application dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Download the actual verified customer export
        uses: actions/download-artifact@v4
        with:
          name: goodies-customer-web-verification-${{ github.sha }}
          path: tiss_tiss_beta/goodies-browser-export
      - name: Install isolated local database test tools outside the application
        run: |
          npm install --prefix "$RUNNER_TEMP/goodies-api-tools" --no-audit --no-fund --no-package-lock --ignore-scripts pg@8.23.1 @embedded-postgres/linux-x64@17.6.0-beta.15
          (
            cd "$RUNNER_TEMP/goodies-api-tools/node_modules/@embedded-postgres/linux-x64"
            node scripts/hydrate-symlinks.js
          )
      - name: Cache and check the real CMS delivery handler
        run: deno check --config supabase/functions/deno.json supabase/functions/wantiss-public-content/index.ts supabase/functions/refresh-goodies-exchange-rate/index.ts
      - name: Exercise local Auth, PostgREST, private Storage, CMS and database recovery
        shell: bash
        env:
          GOODIES_TEST_PG_MODULE: ${{ runner.temp }}/goodies-api-tools/node_modules/pg
        run: |
          set -euo pipefail
          node scripts/test-goodies-local-api.cjs \
            --storage \
            --browser-root goodies-browser-export \
            --native-bin "$RUNNER_TEMP/goodies-api-tools/node_modules/@embedded-postgres/linux-x64/native/bin" \
            --deno-bin "$(command -v deno)" \
            --report goodies-local-api.json | tee goodies-local-api.log
      - name: Retain local acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodies-local-api-${{ github.sha }}
          path: |
            tiss_tiss_beta/goodies-local-api.json
            tiss_tiss_beta/goodies-local-api.log
          if-no-files-found: warn
