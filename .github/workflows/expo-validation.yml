name: Expo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and align dependencies with Expo SDK 58
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          NPM_CONFIG_LEGACY_PEER_DEPS=true npx expo install --fix
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Persist refreshed Expo manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo manifest and lockfile are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: align dependencies with Expo SDK 58" -m "Co-authored-by: Claude <noreply@anthropic.com>"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Install dependencies from the committed lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        run: npx expo lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Export Expo web bundle
        run: npx expo export --platform web
      - name: Expo Doctor
        run: npx expo-doctor

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check deployed edge functions
        run: deno check --node-modules-dir=auto supabase/functions/wantiss-admin-bootstrap/index.ts supabase/functions/wantiss-admin-staff/index.ts supabase/functions/wantiss-public-content/index.ts supabase/functions/rapid-api/index.ts supabase/functions/process-goodies-card-refunds/index.ts supabase/functions/place-goodies-card-order/index.ts
      - name: Test Goodies refund and webhook decision logic
        run: deno test supabase/functions/process-goodies-card-refunds/ supabase/functions/rapid-api/goodiesStripeState_test.ts
