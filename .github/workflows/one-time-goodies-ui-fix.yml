name: One-time Goodies UI and refresh fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fixes
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          def replace_once(path, old, new, label):
              p = root / path
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          p = root / 'src/screens/businessSpace/BusinessSpaceShared.tsx'
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"export function SheetShell\(\{ title, onClose, children, tall \}: any\) \{.*?\n\}\n\n/\*\* Bottom-tab panel\.", re.S)
          new_sheet = r'''export function SheetShell({ title, onClose, children, tall }: any) {
  const t = useTheme(), s = useS(), ins = useSafeAreaInsets(), { height: H } = useWindowDimensions();
  const translateY = useRef(new Animated.Value(0)).current;
  const startY = useRef(0);
  const close = useCallback(() => Animated.timing(translateY, { toValue: H, duration: 180, useNativeDriver: true }).start(onClose), [H, onClose, translateY]);
  const pan = useRef(PanResponder.create({
    onStartShouldSetPanResponder: () => false,
    onMoveShouldSetPanResponder: (_: any, g: any) => g.dy > 8 && Math.abs(g.dy) > Math.abs(g.dx),
    onPanResponderGrant: () => { translateY.stopAnimation((v: number) => { startY.current = v; }); },
    onPanResponderMove: (_: any, g: any) => translateY.setValue(Math.max(0, startY.current + g.dy)),
    onPanResponderRelease: (_: any, g: any) => {
      if (g.dy > 80 || g.vy > 1.2) close();
      else Animated.spring(translateY, { toValue: 0, useNativeDriver: true, bounciness: 0 }).start();
    },
    onPanResponderTerminate: () => Animated.spring(translateY, { toValue: 0, useNativeDriver: true, bounciness: 0 }).start(),
  })).current;
  return (
    <View style={{ ...StyleSheet.absoluteFill, zIndex: 30, justifyContent: 'flex-end' }}>
      <Pressable style={{ ...StyleSheet.absoluteFill, backgroundColor: t.scrim }} onPress={onClose} />
      <Animated.View style={{ transform: [{ translateY }], backgroundColor: t.card, borderTopLeftRadius: 24, borderTopRightRadius: 24, paddingHorizontal: 18, paddingTop: 10, paddingBottom: ins.bottom + 16, maxHeight: H * (tall ? 0.9 : 0.8) }}>
        <View {...pan.panHandlers}>
          <View style={{ alignSelf: 'center', width: 40, height: 5, borderRadius: 3, backgroundColor: t.line, marginBottom: 10 }} />
          <View style={[s.row, { marginBottom: 6 }]}><Text style={[s.h1, { flex: 1, fontSize: 20 }]}>{displayText(title)}</Text><Pressable onPress={onClose} accessibilityLabel="Close"><Icon name="close" size={24} /></Pressable></View>
        </View>
        <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : 'height'} style={{ flexShrink: 1 }}>
          <ScrollView keyboardShouldPersistTaps="handled" showsVerticalScrollIndicator={false}>{children}</ScrollView>
        </KeyboardAvoidingView>
      </Animated.View>
    </View>
  );
}

/** Bottom-tab panel.'''
          s2, n = pattern.subn(new_sheet, s, count=1)
          if n != 1: raise SystemExit(f'SheetShell replacement failed: {n}')
          old = "onStartShouldSetPanResponder: () => !capture,\n    onMoveShouldSetPanResponder: () => !capture,"
          new = "onStartShouldSetPanResponder: () => false,\n    onMoveShouldSetPanResponder: (_: any, g: any) => !capture && Math.abs(g.dy) > 8 && Math.abs(g.dy) > Math.abs(g.dx),"
          if s2.count(old) != 1: raise SystemExit('PanelSheet header responder block not found exactly once')
          s2 = s2.replace(old, new)
          p.write_text(s2, encoding='utf-8')

          replace_once('src/screens/businessSpace/BusinessSpaceAccountScreens.tsx', '''      {picker ? (\n        <View style={{ ...StyleSheet.absoluteFill, zIndex: 35, backgroundColor: t.bg, paddingTop: 60 }}>\n          <View style={{ paddingHorizontal: 16, gap: 10, flex: 1 }}>''', '''      {picker ? (\n        <View style={{ ...StyleSheet.absoluteFill, zIndex: 35, backgroundColor: t.bg, paddingTop: 60 }}>\n          <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : 'height'} style={{ flex: 1 }}>\n          <View style={{ paddingHorizontal: 16, gap: 10, flex: 1 }}>''', 'country picker opening wrapper')
          replace_once('src/screens/businessSpace/BusinessSpaceAccountScreens.tsx', '''            <ScrollView keyboardShouldPersistTaps="handled">{list.map(c => <Pressable key={c.code} onPress={() => { set(picker === 'phone' ? 'phone_country' : 'country', c.code); setPicker(null); setCq(''); }} style={[s.ar, s.div]}><Text style={{ fontSize: 22 }}>{flagOf(c.code)}</Text><Text style={[s.rt, { flex: 1 }]}>{c.name}</Text>{picker === 'phone' ? <Text style={s.mut}>+{c.dial}</Text> : null}</Pressable>)}</ScrollView>\n          </View>\n        </View>''', '''            <ScrollView keyboardShouldPersistTaps="handled" contentContainerStyle={{ paddingBottom: 24 }}>{list.map(c => <Pressable key={c.code} onPress={() => { set(picker === 'phone' ? 'phone_country' : 'country', c.code); setPicker(null); setCq(''); }} style={[s.ar, s.div]}><Text style={{ fontSize: 22 }}>{flagOf(c.code)}</Text><Text style={[s.rt, { flex: 1 }]}>{c.name}</Text>{picker === 'phone' ? <Text style={s.mut}>+{c.dial}</Text> : null}</Pressable>)}</ScrollView>\n          </View>\n          </KeyboardAvoidingView>\n        </View>''', 'country picker keyboard-safe body')

          replace_once('src/screens/businessSpace/BusinessSpaceScreen.tsx', "['wallet_ledger', 'feature_orders', 'notifications', 'business_activity', 'listings', 'conversations', 'payout_methods']", "['wallet_ledger', 'feature_orders', 'notifications', 'business_activity', 'listings', 'conversations', 'payout_methods', 'goodies_products', 'goodies_builder_configs']", 'Business Space realtime tables')
          replace_once('src/screens/businessSpace/BusinessSpaceGoodies.tsx', "supabase.from('goodies_products').select('id,name,description,price,emoji,stock,is_available,restriction,photo_url,review_status,review_note')", "supabase.from('goodies_products').select('id,name,description,price,emoji,stock,is_available,restriction,photo_url,photo_urls,review_status,review_note')", 'Goodies product gallery select')

          p = root / 'src/screens/businessSpace/BusinessSpaceGoodies.tsx'
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"  useEffect\(\(\) => \{\n    let active = true;\n    setLoading\(true\); setLoadError\(''\); setB\(null\);\n.*?  \}, \[app\.biz\.id, id, createType\]\);", re.S)
          m = pat.search(s)
          if not m: raise SystemExit('Custom Product loading effect not found')
          new = '''  useEffect(() => {
    let active = true;
    setLoading(true); setLoadError(''); setB(null);
    const attachAssets = (builder: GBuilder, library: any[]): GBuilder => ({
      ...builder,
      groups: builder.groups.map(group => ({
        ...group,
        items: group.items.map(item => ({ ...item, assetUrl: item.assetUrl || library.find(asset => asset.id === item.assetId)?.assetUrl || null }))
      }))
    });
    (async () => {
      try {
        const rows = await goodiesApi.listBuilders(app.biz.id);
        if (!active) return;
        const initial = createType ? newBuilder(createType) : id ? rows.find(x => x.id === id) || null : null;
        setAll(rows);
        setB(initial);
        setLoading(false);
        try {
          const library = await goodiesApi.library();
          if (!active) return;
          setAll(current => current.map(builder => attachAssets(builder, library)));
          setB(current => current ? attachAssets(current, library) : current);
        } catch {
          // Asset metadata is optional for opening the editor; keep the builder usable.
        }
      } catch (e) {
        if (active) { setLoadError(errText(e)); setLoading(false); }
      }
    })();
    return () => { active = false; };
  }, [app.biz.id, id, createType]);'''
          s = s[:m.start()] + new + s[m.end():]
          p.write_text(s, encoding='utf-8')

          wf = root / '.github/workflows/one-time-goodies-ui-fix.yml'
          if wf.exists(): wf.unlink()
          print('All requested patches applied.')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Goodies refresh and business-space sheets"
          git push origin HEAD:main
