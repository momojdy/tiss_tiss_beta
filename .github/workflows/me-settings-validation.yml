name: Me Settings Validation
on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/screens/SettingsScreen.tsx'
      - 'src/screens/SettingsDetailScreen.tsx'
      - 'src/screens/AddressesScreen.tsx'
      - 'src/screens/PersonalInformationScreen.tsx'
      - 'src/screens/AccountSecurityScreen.tsx'
      - 'supabase/migrations/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/me-settings-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:main
          fi
      - run: npm ci
      - run: npx tsc --noEmit
