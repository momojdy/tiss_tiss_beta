name: Me Settings Validation
on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/screens/SettingsScreen.tsx'
      - 'src/screens/SettingsDetailScreen.tsx'
      - 'src/screens/AddressesScreen.tsx'
      - 'src/screens/PersonalInformationScreen.tsx'
      - 'src/screens/AccountSecurityScreen.tsx'
      - 'supabase/migrations/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/me-settings-validation.yml'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
