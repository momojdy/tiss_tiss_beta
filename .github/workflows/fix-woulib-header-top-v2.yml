name: Fix Woulib header top spacing v2
on:
  push:
    branches: [fix/woulib-header-top-100-v2]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix only WoulibHome top padding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          start = s.find('function WoulibHome(')
          marker = s.find('/* ═══════════════════════════════════════════════════════════════════════', start)
          if start < 0 or marker < 0:
              raise SystemExit('Could not isolate WoulibHome')
          home = s[start:marker]
          old = 'paddingTop: MAP_TOP,'
          if home.count(old) != 1:
              raise SystemExit(f'Expected exactly one WoulibHome paddingTop, found {home.count(old)}')
          home = home.replace(old, 'paddingTop: 0,', 1)
          p.write_text(s[:start] + home + s[marker:])
          PY
          git diff --check
          git add src/features/woulib/WoulibFlow.tsx
          git commit -m "Fix Woulib header top spacing"
          git push origin HEAD
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-woulib-header-top-v2.yml
          git commit -m "chore: remove temporary Woulib header workflow"
          git push origin HEAD
