name: Vendor Business Space validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/vendor-business-space-react-native]

jobs:
  vendor-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Business Space screen
        run: >-
          npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --esModuleInterop
          --jsx react-native --target ES2022 --moduleResolution bundler
          --module ESNext src/features/businessSpace/BusinessSpaceScreen.tsx
