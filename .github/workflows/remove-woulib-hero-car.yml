name: Fix Woulib upcoming ride field
on:
  push:
    branches: [woulib-home-reference-ui]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Woulib upcoming ride field'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix upcoming ride rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          old = "{ride.date} · {ride.time}"
          new = "{ride.when}"
          if old not in s:
              raise SystemExit('outdated upcoming ride expression not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit source fix
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/woulib/WoulibFlow.tsx
          git commit -m 'Fix Woulib upcoming ride field'
          git push origin HEAD:woulib-home-reference-ui
