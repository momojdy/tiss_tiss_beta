name: Repair Expo SDK 58 patch lock once
on:
  push:
    paths:
      - '.github/workflows/refresh-sdk58-patches-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize package-lock with verified Expo 58 patches
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Expo SDK 58 patch lockfile"
            git push origin HEAD:main
          fi
