name: TypeScript and Expo build checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Konsoliss homepage and data integrity tests
        run: npm run test:konsoliss
      - name: TypeScript check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Expo web export
        run: npx expo export --platform web --output-dir /tmp/wantiss-web-export
