name: Polish Woulib home
on:
  push:
    branches: [polish/woulib-home]
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Polish Woulib home layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          start = s.index('function WoulibHome(')
          end = s.index('\n\n/* ═══════════════════════════════════════════════════════════════════════\n *  WOULIB FLOW', start)
          new = r'''function WoulibHome({upcoming, onFind, onOffer, onExit}: {upcoming: WoulibUpcomingRide[]; onFind: (dest?: string) => void; onOffer: () => void; onExit?: () => void}) {
  const {t, dark, toggle} = useWoulibTheme();
  useEffect(() => {
    let id: ReturnType<typeof setTimeout> | undefined;
    const h = InteractionManager.runAfterInteractions(() => { id = setTimeout(() => { getCity(dark); getTraffic(); }, 300); });
    return () => { h.cancel(); if (id) clearTimeout(id); };
  }, [dark]);

  const row = (icon: keyof typeof Ionicons.glyphMap, color: string, title: string, subtitle: string, onPress: () => void, last = false) => (
    <Pressable onPress={onPress} style={({pressed}) => [{flexDirection: 'row', alignItems: 'center', paddingVertical: 12, borderBottomWidth: last ? 0 : 1, borderBottomColor: t.line, opacity: pressed ? 0.72 : 1}]}>
      <View style={{width: 38, height: 38, borderRadius: 19, backgroundColor: dark ? '#24242A' : '#F5F1E7', alignItems: 'center', justifyContent: 'center'}}><Ionicons name={icon} size={19} color={color} /></View>
      <View style={{flex: 1, marginLeft: 12}}>
        <Text style={{color: t.ink, fontSize: 13.5, fontWeight: '700'}}>{title}</Text>
        <Text style={{color: t.muted, fontSize: 12.5, marginTop: 2}}>{subtitle}</Text>
      </View>
      <Ionicons name="chevron-forward" size={18} color={t.muted} />
    </Pressable>
  );

  const smallField = (icon: keyof typeof Ionicons.glyphMap, title: string, value: string, onPress: () => void) => (
    <Pressable onPress={onPress} style={{flex: 1, minHeight: 60, paddingHorizontal: 12, paddingVertical: 9, borderRadius: 12, backgroundColor: t.soft, justifyContent: 'center'}}>
      <View style={{flexDirection: 'row', alignItems: 'center'}}><Ionicons name={icon} size={17} color={t.ink} /><Text style={{color: t.muted, fontSize: 11.5, marginLeft: 7}}>{title}</Text></View>
      <Text style={{color: t.ink, fontSize: 13, fontWeight: '700', marginTop: 4}}>{value}</Text>
    </Pressable>
  );

  return (
    <View style={{flex: 1, backgroundColor: t.bg}}>
      <ScrollView contentContainerStyle={{paddingTop: MAP_TOP, paddingHorizontal: 18, paddingBottom: 112}} showsVerticalScrollIndicator={false}>
        <View style={{flexDirection: 'row', alignItems: 'center'}}>
          {onExit && <Pressable onPress={onExit} style={[styles.circle, {backgroundColor: t.card, marginRight: 10}]}><Ionicons name="arrow-back" size={18} color={t.ink} /></Pressable>}
          <View style={{flex: 1}}>
            <Text style={{color: t.ink, fontSize: 31, fontWeight: '900', letterSpacing: -1.2}}>WOULIB<Text style={{color: YELLOW}}>.</Text></Text>
            <Text style={{color: t.muted, fontSize: 13, marginTop: -2}}>Share rides. Go further.</Text>
          </View>
          <Pressable style={[styles.circle, {backgroundColor: t.card, marginRight: 8}]}><Ionicons name="person" size={18} color={t.ink} /></Pressable>
          <Pressable onPress={toggle} style={[styles.circle, {backgroundColor: t.card}]}><Ionicons name={dark ? 'sunny' : 'moon'} size={18} color={t.ink} /></Pressable>
        </View>

        <View style={{height: 126, marginTop: 18, borderRadius: 18, overflow: 'hidden', backgroundColor: dark ? '#19191D' : '#303945'}}>
          <View style={{position: 'absolute', left: -30, bottom: 18, width: 270, height: 5, backgroundColor: '#777F88', transform: [{rotate: '-15deg'}]}} />
          <View style={{position: 'absolute', left: 135, bottom: 0, width: 230, height: 7, backgroundColor: YELLOW, transform: [{rotate: '-38deg'}]}} />
          <View style={{position: 'absolute', left: 168, bottom: 4, width: 230, height: 4, backgroundColor: '#fff', opacity: 0.9, transform: [{rotate: '-38deg'}]}} />
          <View style={{position: 'absolute', right: 30, top: 25, width: 48, height: 48, borderRadius: 24, borderWidth: 8, borderColor: YELLOW, backgroundColor: 'rgba(254,197,9,0.12)', alignItems: 'center', justifyContent: 'center'}}><Ionicons name="location" size={24} color={YELLOW} /></View>
          <View style={{padding: 18, width: '72%'}}>
            <Text style={{color: '#fff', fontSize: 19, lineHeight: 23, fontWeight: '800'}}>You're already going there. Why not</Text>
            <Text style={{color: YELLOW, fontSize: 19, lineHeight: 23, fontWeight: '900'}}>share the ride?</Text>
          </View>
        </View>

        <View style={{flexDirection: 'row', marginTop: 14}}>
          <Pressable onPress={() => onFind()} style={({pressed}) => [{flex: 1, height: 58, borderRadius: 14, backgroundColor: YELLOW, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', opacity: pressed ? 0.86 : 1, marginRight: 8}]}>
            <Ionicons name="car" size={21} color="#111" /><Text style={{color: '#111', fontSize: 15.5, fontWeight: '900', marginLeft: 8}}>Find a Ride</Text><Ionicons name="arrow-forward" size={18} color="#111" style={{marginLeft: 8}} />
          </Pressable>
          <Pressable onPress={onOffer} style={({pressed}) => [{flex: 1, height: 58, borderRadius: 14, backgroundColor: t.card, borderWidth: 1, borderColor: YELLOW, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', opacity: pressed ? 0.86 : 1}]}>
            <Ionicons name="add" size={24} color={t.ink} /><Text style={{color: t.ink, fontSize: 15.5, fontWeight: '900', marginLeft: 5}}>Offer a Ride</Text>
          </Pressable>
        </View>

        <View style={{marginTop: 14, backgroundColor: t.card, borderRadius: 18, borderWidth: 1, borderColor: t.line, padding: 12}}>
          {row('location', YELLOW, 'From', 'Where are you leaving from?', () => onFind())}
          {row('location-outline', dark ? YELLOW : '#111', 'To', 'Where are you going?', () => onFind())}
          <View style={{flexDirection: 'row', borderTopWidth: 1, borderTopColor: t.line, paddingTop: 9, marginTop: 2}}>
            {smallField('calendar', 'Date', 'Today', () => onFind())}
            <View style={{width: 8}} />
            {smallField('time-outline', 'Time', 'Anytime', () => onFind())}
          </View>
          {row('person', t.ink, 'Passengers', '1 passenger', () => onFind(), true)}
          <Pressable onPress={() => onFind()} style={({pressed}) => [{height: 54, marginTop: 9, borderRadius: 14, backgroundColor: YELLOW, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', opacity: pressed ? 0.86 : 1}]}>
            <Ionicons name="search" size={21} color="#111" /><Text style={{color: '#111', fontSize: 16, fontWeight: '900', marginLeft: 8}}>Find Rides</Text>
          </Pressable>
        </View>

        <View style={{flexDirection: 'row', alignItems: 'center', marginTop: 22, marginBottom: 9}}><Text style={{flex: 1, color: t.ink, fontSize: 18, fontWeight: '900'}}>Nearby Rides</Text><Pressable onPress={() => onFind()}><Text style={{color: YELLOW, fontSize: 12.5, fontWeight: '800'}}>See All ›</Text></Pressable></View>
        {NEARBY.slice(0, 2).map(r => (
          <Pressable key={r.id} onPress={() => onFind(r.to)} style={({pressed}) => [{backgroundColor: t.card, borderRadius: 17, borderWidth: 1, borderColor: t.line, padding: 10, marginBottom: 10, opacity: pressed ? 0.82 : 1}]}>
            <View style={{flexDirection: 'row', alignItems: 'center'}}>
              <View style={{width: 76, height: 76, borderRadius: 13, backgroundColor: t.soft, alignItems: 'center', justifyContent: 'center'}}><Ionicons name="car-sport" size={40} color={t.ink} /></View>
              <View style={{flex: 1, marginLeft: 11}}>
                <Text style={{color: t.ink, fontSize: 15, fontWeight: '900'}} numberOfLines={1}>{r.from} → {r.to}</Text>
                <Text style={{color: t.muted, fontSize: 12.5, marginTop: 3}}>{r.when}</Text>
                <Text style={{color: t.ink, fontSize: 12.5, marginTop: 4}}>♙ {r.seats} seats left  ·  ${r.price}</Text>
                <Text style={{color: t.muted, fontSize: 12, marginTop: 3}}>★ {r.name} · {r.away} away</Text>
              </View>
              <Ionicons name="chevron-forward" size={18} color={t.muted} />
            </View>
          </Pressable>
        ))}

        <View style={{flexDirection: 'row', alignItems: 'center', marginTop: 14, marginBottom: 9}}><Text style={{flex: 1, color: t.ink, fontSize: 18, fontWeight: '900'}}>Your Upcoming Rides</Text><Pressable><Text style={{color: YELLOW, fontSize: 12.5, fontWeight: '800'}}>See All ›</Text></Pressable></View>
        {upcoming.slice(0, 2).map(r => (
          <View key={r.id} style={{backgroundColor: t.card, borderRadius: 17, borderWidth: 1, borderColor: t.line, padding: 12, marginBottom: 10}}>
            <View style={{flexDirection: 'row', alignItems: 'center'}}>
              <View style={{width: 48, height: 48, borderRadius: 14, backgroundColor: t.yellowSoft, alignItems: 'center', justifyContent: 'center'}}><Ionicons name="car" size={24} color={t.ink} /></View>
              <View style={{flex: 1, marginLeft: 12}}>
                <Text style={{color: t.ink, fontSize: 14.5, fontWeight: '900'}}>{r.from} → {r.to}</Text>
                <Text style={{color: t.muted, fontSize: 12.5, marginTop: 3}}>{r.when}</Text>
                <Text style={{color: t.muted, fontSize: 12, marginTop: 3}}>Driver · {r.driver}</Text>
              </View>
              <View style={{backgroundColor: r.status === 'Confirmed' ? t.soft : t.yellowSoft, borderRadius: 99, paddingHorizontal: 9, paddingVertical: 5}}><Text style={{color: r.status === 'Confirmed' ? t.green : t.ink, fontSize: 10.5, fontWeight: '900'}}>{r.status}</Text></View>
            </View>
          </View>
        ))}
      </ScrollView>

      <View style={{position: 'absolute', left: 12, right: 12, bottom: 14, height: 66, borderRadius: 18, backgroundColor: t.card, borderWidth: 1, borderColor: t.line, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-around', elevation: 6, shadowColor: '#000', shadowOpacity: dark ? 0.28 : 0.12, shadowRadius: 8, shadowOffset: {width: 0, height: 3}}}>
        <View style={{alignItems: 'center'}}><Ionicons name="home" size={23} color={YELLOW} /><Text style={{color: YELLOW, fontSize: 10.5, fontWeight: '800', marginTop: 3}}>Home</Text></View>
        <Pressable onPress={() => onFind()} style={{alignItems: 'center'}}><Ionicons name="search" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Search</Text></Pressable>
        <Pressable onPress={onOffer} style={{alignItems: 'center'}}><Ionicons name="add-circle-outline" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Offer</Text></Pressable>
        <Pressable style={{alignItems: 'center'}}><Ionicons name="person-outline" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Profile</Text></Pressable>
      </View>
    </View>
  );
}
