name: Polish Woulib home
on:
  push:
    branches:
      - polish/woulib-home
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Polish Woulib home layout
        env:
          INSERT_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          start = s.index('function WoulibHome(')
          end = s.index('\n\n/* ═══════════════════════════════════════════════════════════════════════\n *  WOULIB FLOW', start)
          home = s[start:end]
          old_start = home.index("        <View style={{flexDirection: 'row', marginTop: 20}}>")
          old_end = home.index("        {head('Nearby rides')}", old_start)
          banner = '''        <View style={{height: 126, marginTop: 18, borderRadius: 18, overflow: 'hidden', backgroundColor: dark ? '#19191D' : '#303945'}}>
          <View style={{position: 'absolute', left: 135, bottom: 0, width: 230, height: 7, backgroundColor: YELLOW, transform: [{rotate: '-38deg'}]}} />
          <View style={{position: 'absolute', left: 168, bottom: 4, width: 230, height: 4, backgroundColor: '#fff', opacity: 0.9, transform: [{rotate: '-38deg'}]}} />
          <View style={{position: 'absolute', right: 30, top: 25, width: 48, height: 48, borderRadius: 24, borderWidth: 8, borderColor: YELLOW, backgroundColor: 'rgba(254,197,9,0.12)', alignItems: 'center', justifyContent: 'center'}}><Ionicons name="location" size={24} color={YELLOW} /></View>
          <View style={{padding: 18, width: '72%'}}><Text style={{color: '#fff', fontSize: 19, lineHeight: 23, fontWeight: '800'}}>You're already going there. Why not</Text><Text style={{color: YELLOW, fontSize: 19, lineHeight: 23, fontWeight: '900'}}>share the ride?</Text></View>
        </View>

'''
          insert = base64.b64decode(os.environ['INSERT_B64']).decode()
          home = home[:old_start] + banner + insert + home[old_end:]
          bottom = '''

      <View style={{position: 'absolute', left: 12, right: 12, bottom: 14, height: 66, borderRadius: 18, backgroundColor: t.card, borderWidth: 1, borderColor: t.line, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-around', elevation: 6, shadowColor: '#000', shadowOpacity: dark ? 0.28 : 0.12, shadowRadius: 8, shadowOffset: {width: 0, height: 3}}}>
        <View style={{alignItems: 'center'}}><Ionicons name="home" size={23} color={YELLOW} /><Text style={{color: YELLOW, fontSize: 10.5, fontWeight: '800', marginTop: 3}}>Home</Text></View>
        <Pressable onPress={() => onFind()} style={{alignItems: 'center'}}><Ionicons name="search" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Search</Text></Pressable>
        <Pressable onPress={onOffer} style={{alignItems: 'center'}}><Ionicons name="add-circle-outline" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Offer</Text></Pressable>
        <Pressable style={{alignItems: 'center'}}><Ionicons name="person-outline" size={23} color={t.muted} /><Text style={{color: t.muted, fontSize: 10.5, marginTop: 3}}>Profile</Text></Pressable>
      </View>'''
          home = home.replace('      </ScrollView>\n    </View>\n  );\n}', '      </ScrollView>' + bottom + '\n    </View>\n  );\n}', 1)
          p.write_text(s[:start] + home + s[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/woulib/WoulibFlow.tsx
          git commit -m 'Polish Woulib home layout'
          git push
