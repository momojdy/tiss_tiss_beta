name: Woulib Home edit
on:
  push:
    branches:
      - fix/woulib-home-carousel
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply HomeScreen-only change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/HomeScreen.tsx')
          s = p.read_text()
          old = "const ASSETS:Record<string,string>={Goodies:BASE+'Goodies.PNG',Services:BASE+'Services.PNG'"
          new = "const ASSETS:Record<string,string>={Goodies:BASE+'Goodies.PNG',Woulib:BASE+'Woulib.PNG',Services:BASE+'Services.PNG'"
          if old in s and 'Woulib:BASE+' in s:
              raise SystemExit('Woulib asset already present')
          if old not in s:
              raise SystemExit('Expected ASSETS text not found')
          s = s.replace(old, new, 1)
          old2 = "const COLLAPSED:{label:string;icon:MI}[]=[{label:'Goodies',icon:'card-giftcard'},{label:'Services',icon:'miscellaneous-services'},{label:'Globiz',icon:'language'},{label:'Konsoliss',icon:'people-outline'}];"
          new2 = "const COLLAPSED:{label:string;icon:MI}[]=[{label:'Goodies',icon:'card-giftcard'},{label:'Woulib',icon:'directions-car'},{label:'Services',icon:'miscellaneous-services'},{label:'Globiz',icon:'language'},{label:'Konsoliss',icon:'people-outline'}];"
          if old2 not in s:
              raise SystemExit('Expected COLLAPSED text not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/woulib-home-edit.yml
      - name: Commit HomeScreen change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreen.tsx .github/workflows/woulib-home-edit.yml
          git commit -m "Add Woulib after Goodies on Home carousel"
          git push
