name: Fix Woulib HomeScreen press handler
on:
  push:
    branches: [fix/woulib-home-press-handler]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing destructured prop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/screens/HomeScreen.tsx')
          s=p.read_text()
          old='export default function HomeScreen({onMePress,onFrenziesPress,onFlyzPress,onKonsolissPress,onGoodiesPress,}:{onMePress?:()=>void;onFrenziesPress?:()=>void;onFlyzPress?:()=>void;onKonsolissPress?:()=>void;onGoodiesPress?:()=>void;onWoulibPress?:()=>void}){'
          new='export default function HomeScreen({onMePress,onFrenziesPress,onFlyzPress,onKonsolissPress,onGoodiesPress,onWoulibPress,}:{onMePress?:()=>void;onFrenziesPress?:()=>void;onFlyzPress?:()=>void;onKonsolissPress?:()=>void;onGoodiesPress?:()=>void;onWoulibPress?:()=>void}){'
          if old not in s:
              raise SystemExit('Expected HomeScreen signature not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/HomeScreen.tsx
          git commit -m 'Fix Woulib HomeScreen press handler'
          git push
