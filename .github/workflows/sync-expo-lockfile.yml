name: Sync Expo SDK lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/sync-expo-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore: regenerate Expo SDK lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the declared Expo SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate Expo SDK lockfile" -m "Co-authored-by: Claude <noreply@anthropic.com>"
          git push origin main
