name: Apply Woulib header layout polish
on:
  push:
    branches: [polish/woulib-header-100px]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust only WoulibHome header layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          old = """        <View\n          style={{\n            flexDirection: 'row',\n            alignItems: 'center',\n            justifyContent: 'space-between',\n            marginBottom: 18,\n          }}\n        >"""
          new = """        <View\n          style={{\n            height: 100,\n            flexDirection: 'row',\n            alignItems: 'flex-end',\n            justifyContent: 'space-between',\n            marginBottom: 18,\n          }}\n        >"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one WoulibHome header wrapper, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify only intended file changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/features/woulib/WoulibFlow.tsx"
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/woulib/WoulibFlow.tsx
          git rm .github/workflows/woulib-header-100px.yml
          git commit -m "Polish Woulib header 100px bottom alignment"
          git push origin HEAD:polish/woulib-header-100px
