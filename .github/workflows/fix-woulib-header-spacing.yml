name: Fix Woulib header top spacing
on:
  push:
    branches: [fix/woulib-header-top-spacing]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested one-line change
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/woulib/WoulibFlow.tsx')
          s = p.read_text()
          old = "paddingTop: MAP_TOP,"
          new = "paddingTop: 0,"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
      - name: Commit only WoulibFlow change and remove temporary workflow
        run: |
          rm .github/workflows/fix-woulib-header-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/woulib/WoulibFlow.tsx
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "src/features/woulib/WoulibFlow.tsx"
          git commit -m "Fix Woulib home header top spacing"
          git push origin HEAD:fix/woulib-header-top-spacing
# trigger
